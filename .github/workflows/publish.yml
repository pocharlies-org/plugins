name: Publish

on:
  push:
    branches: [main]
    paths:
      - plugins/**
      - categories.json
      - featured.json
      - scripts/**
  schedule:
    # Daily, so install counts stay current.
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # INFRA-1218: job del upstream getpaseo/plugins; queda skipped en el fork
    if: github.repository == 'getpaseo/plugins'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # INFRA-1218: job del upstream getpaseo/plugins; queda skipped en el fork
    if: github.repository == 'getpaseo/plugins'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
